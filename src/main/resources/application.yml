spring:
  application:
    name: spring-authorization-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5433/spring_authorization_service}
    username: ${AUTH_DB_USER:postgres}
    password: ${AUTH_DB_PASSWORD:12345}
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 9001

app:
  oauth:
    issuer: ${AUTH_ISSUER:http://localhost:9000}
    client-id: ${AUTH_CLIENT_ID:postman-client}
    client-secret: ${AUTH_CLIENT_SECRET:dev-secret-change-me}
    oidc-client-id: ${AUTH_OIDC_CLIENT_ID:oidc-client}
    oidc-client-secret: ${AUTH_OIDC_CLIENT_SECRET:secret}
    oidc-redirect-uri: ${AUTH_OIDC_REDIRECT_URI:http://127.0.0.1:8080/login/oauth2/code/oidc-client}
    postman-redirect-uri: ${AUTH_POSTMAN_REDIRECT_URI:https://oauth.pstmn.io/v1/browser-callback}
    public-client-id: ${AUTH_PUBLIC_CLIENT_ID:public-client}
    public-origin: ${AUTH_PUBLIC_ORIGIN:http://127.0.0.1:4200}
    public-redirect-uri: ${AUTH_PUBLIC_REDIRECT_URI:http://127.0.0.1:4200}
    custom-client-id: ${AUTH_CUSTOM_CLIENT_ID:custom-code-client}
    custom-client-secret: ${AUTH_CUSTOM_CLIENT_SECRET:custom-code-secret-change-me}
    registrar-client-id: ${AUTH_REGISTRAR_CLIENT_ID:registrar-client}
    registrar-client-secret: ${AUTH_REGISTRAR_CLIENT_SECRET:registrar-secret-change-me}
    tenant-client-secret: ${AUTH_TENANT_CLIENT_SECRET:tenant-secret-change-me}
    user-name: ${AUTH_USER_NAME:user}
    user-password: ${AUTH_USER_PASSWORD:password}
    user-display-name: ${AUTH_USER_DISPLAY_NAME:Demo User}
    user-email: ${AUTH_USER_EMAIL:user@example.com}
