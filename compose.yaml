services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spring_authorization_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "12345"
    ports:
      - "5433:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spring_authorization_service"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auth-postgres-data:
